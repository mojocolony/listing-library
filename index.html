<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1ec"><title>Listing Library</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><div class="mark">⌂</div><div><h1>Listing Library</h1><span>Personal property archive</span></div></div><div class="actions"><button id="openLibrary" class="secondary">Open Library</button><button id="back" class="secondary hidden">← Library</button></div></header>
<main>
<section id="libraryView"><div class="toolbar"><div><h2>Properties</h2><p id="count">1 property</p></div><div class="tools"><input id="search" type="search" placeholder="Search properties"><button id="favFilter" class="iconBtn" title="Show favourites">♡</button></div></div><div id="grid" class="grid"></div><div class="hint"><strong>v0.1.0</strong> · The Oak Knoll sample is built in. “Open Library” can scan folders on supported desktop browsers.</div></section>
<section id="detailView" class="hidden"><div id="detail"></div></section>
</main><script src="app.js"></script></body></html>
