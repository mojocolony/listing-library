<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f1ec">
  <title>Listing Library</title>
  <link rel="icon" href="https://unpkg.com/lucide-static@1.45.0/icons/houses.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=0.1.10">
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><img src="https://unpkg.com/lucide-static@1.45.0/icons/houses.svg" alt=""></div>
    <div>
      <div class="brandTitle"><h1>Listing Library</h1><span class="version">v0.1.10</span></div>
      <span>Personal real estate archive</span>
    </div>
  </div>
  <div class="actions">
    <button id="openLibrary" class="secondary">Open Library</button>
    <button id="back" class="secondary hidden">← Library</button>
  </div>
</header>

<main>
  <section id="libraryView">
    <div class="toolbar">
      <div>
        <h2 id="libraryHeading">Properties</h2>
        <p id="count">1 property</p>
      </div>
      <div class="tools">
        <div class="viewSwitch" role="group" aria-label="Property view">
          <button id="allView" class="viewBtn active">All Properties</button>
          <button id="favView" class="viewBtn">♡ Favourites</button>
        </div>
        <input id="search" type="search" placeholder="Search properties">
        <div class="selectShell tagSelectShell">
          <select id="tagFilter" aria-label="Filter by tag"><option value="">All tags</option></select>
        </div>
        <div class="selectShell sortSelectShell">
          <select id="sortSelect" aria-label="Sort properties">
            <option value="newest">Newest</option>
            <option value="az">A–Z</option>
            <option value="za">Z–A</option>
          </select>
        </div>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div class="hint"><strong>v0.1.10</strong> · Property metadata is stored in property.json; your chosen library folder is remembered when browser permission allows.</div>
  </section>
  <section id="detailView" class="hidden"><div id="detail"></div></section>
</main>
<script src="app.js?v=0.1.10"></script>
</body>
</html>
