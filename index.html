<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1ec"><title>Listing Library</title><link rel="stylesheet" href="styles.css?v=0.1.5"></head><body>
<header><div class="brand"><div class="mark" aria-hidden="true"><img src="https://unpkg.com/lucide-static@1.45.0/icons/houses.svg" alt=""></div><div><div class="brandTitle"><h1>Listing Library</h1><span class="version">v0.1.5</span></div><span>Personal property archive</span></div></div><div class="actions"><button id="openLibrary" class="secondary">Open Library</button><button id="back" class="secondary hidden">← Library</button></div></header>
<main>
<section id="libraryView"><div class="toolbar"><div><h2 id="libraryHeading">Properties</h2><p id="count">1 property</p></div><div class="tools"><div class="viewSwitch" role="group" aria-label="Property view"><button id="allView" class="viewBtn active">All Properties</button><button id="favView" class="viewBtn">♡ Favourites</button></div><input id="search" type="search" placeholder="Search properties"><select id="tagFilter" aria-label="Filter by tag"><option value="">All tags</option></select></div></div><div id="grid" class="grid"></div><div class="hint"><strong>v0.1.5</strong> · Open Library scans your property folders on supported desktop browsers.</div></section>
<section id="detailView" class="hidden"><div id="detail"></div></section>
</main><script src="app.js?v=0.1.5"></script></body></html>
